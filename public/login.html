<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SurveyHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Login</h1>
      <form id="loginForm">
        <label>Email
          <input type="email" name="email" id="email" required>
        </label>
        <label>Password
          <input type="password" name="password" id="password" required>
        </label>
        <div id="message" role="status" aria-live="polite"></div>
        <button class="btn btn-cta" type="submit">Sign in</button>
      </form>
      <p class="muted">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('message');
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        msg.textContent='';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        try{
          const res = await fetch('/api/login', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if(!res.ok){ msg.textContent = data.error || 'Login failed'; return; }
          msg.textContent = 'Login successful — redirecting...';
          // TODO: set session / token. For now just redirect
          setTimeout(()=> location.href = '/', 800);
        }catch(err){ msg.textContent = 'Network error'; console.error(err); }
      });
    })();
  </script>
</body>
</html>
