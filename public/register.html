<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — SurveyHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Register</h1>
      <form id="registerForm">
        <label>Name
          <input type="text" name="name" id="name" required>
        </label>
        <label>Email
          <input type="email" name="email" id="email" required>
        </label>
        <label>Password
          <input type="password" name="password" id="password" minlength="8" required>
        </label>
        <label>Confirm Password
          <input type="password" name="confirm" id="confirm" minlength="8" required>
        </label>
        <div id="message" role="status" aria-live="polite"></div>
        <button class="btn btn-cta" type="submit">Create account</button>
      </form>
      <p class="muted">Already registered? <a href="/login.html">Sign in</a></p>
    </div>
  </main>

  <script>
    (function(){
      const form = document.getElementById('registerForm');
      const msg = document.getElementById('message');
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        msg.textContent = '';
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if(password !== confirm){ msg.textContent = 'Passwords do not match'; return; }
        try{
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          const data = await res.json();
          if(!res.ok){ msg.textContent = data.error || 'Registration failed'; return; }
          msg.textContent = 'Registered successfully — redirecting to login...';
          setTimeout(()=> location.href = '/login.html', 1200);
        }catch(err){ msg.textContent = 'Network error'; console.error(err); }
      });
    })();
  </script>
</body>
</html>
